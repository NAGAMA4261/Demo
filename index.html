<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RARA Dhaba — Taste Authentic Indian Flavors at Murthal!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,700&family=Comfortaa:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root {
  --orange: #FF8806;
  --orange-dark: #D97200;
  --orange-pale: #FFF3E0;
  --offwhite: #F3F3F3;
  --darkbg: #0D0D0D;
  --text-dark: #111111;
  --text-mid: #555555;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'Comfortaa', sans-serif; background: #fff; color: var(--text-dark); overflow-x: hidden; }
.fp { font-family: 'Playfair Display', serif !important; }
.fb { font-family: 'Comfortaa', sans-serif !important; }
.no-scroll::-webkit-scrollbar { display: none; }
.no-scroll { -ms-overflow-style: none; scrollbar-width: none; }

.header-scrolled {
  background: rgba(255, 255, 255, 0.85) !important;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow: 0 4px 30px rgba(0, 0, 0, 0.03);
  border-bottom: 1px solid rgba(255, 255, 255, 0.4);
}

.cat-active {
  background: var(--darkbg) !important;
  color: #fff !important;
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
  transform: translateY(-2px);
}
.cat-inactive {
  background: #F8F8F8;
  color: var(--text-mid);
}
.cat-inactive:hover {
  background: #EEEEEE;
  color: var(--text-dark);
}
</style>
</head>
<body class="bg-white">

<header id="header" class="fixed top-0 left-0 w-full z-50 transition-all duration-300 bg-transparent py-4 px-6 md:px-12 flex justify-between items-center">
  <a href="#" class="fp text-2xl font-black tracking-tight text-black flex items-center gap-1">
    RARA<span class="text-[#FF8806]">.</span><span class="text-xs uppercase tracking-widest text-gray-400 font-sans ml-1">DHABA</span>
  </a>
  <div class="hidden md:flex items-center gap-8 font-medium text-sm tracking-wide">
    <a href="#" class="hover:text-[#FF8806] transition-colors">Home</a>
    <a href="#menu" class="hover:text-[#FF8806] transition-colors">Our Menu</a>
  </div>
  <button id="mobileMenuBtn" class="md:hidden text-2xl text-black focus:outline-none">☰</button>
</header>

<div id="mobileNav" class="hidden fixed inset-0 bg-white z-40 flex-col items-center justify-center gap-6 text-xl font-bold transition-all duration-300">
  <a href="#" onclick="document.getElementById('mobileNav').style.display='none'" class="hover:text-[#FF8806]">Home</a>
  <a href="#menu" onclick="document.getElementById('mobileNav').style.display='none'" class="hover:text-[#FF8806]">Our Menu</a>
</div>

<section class="relative min-h-[85vh] pt-24 pb-12 flex items-center px-6 md:px-12 bg-gradient-to-br from-[#FFF9F2] via-white to-white overflow-hidden">
  <div class="max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-12 gap-12 items-center relative z-10">
    <div class="lg:col-span-6 space-y-6 text-center lg:text-left">
      <span class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-[#FFF3E0] text-[#FF8806] font-bold text-xs uppercase tracking-widest mx-auto lg:mx-0">
        ✨ Authentic Murthal Taste
      </span>
      <h1 class="fp text-4xl sm:text-5xl md:text-6xl font-black text-black leading-[1.1]">
        Where Luxury <br class="hidden sm:block">Meets Pure <br class="hidden sm:block">
        <span class="text-[#FF8806] underline decoration-wavy decoration-1 underline-offset-8">Desi Flavors</span>
      </h1>
      <p class="text-gray-600 max-w-lg mx-auto lg:mx-0 leading-relaxed text-sm md:text-base">
        Experience the rich heritage of authentic North Indian cuisine crafted with premium organic ingredients and pure desi ghee.
      </p>
      
      <div class="relative max-w-md mx-auto lg:mx-0 mt-4 shadow-xl shadow-gray-200/50 rounded-2xl overflow-hidden border border-gray-100">
        <input type="text" id="heroSearch" placeholder="Search your cravings... (e.g., Paneer, Paratha)" class="w-full pl-6 pr-12 py-4 text-sm bg-white text-black placeholder-gray-400 focus:outline-none font-medium">
        <div class="absolute right-4 top-1/2 -translate-y-1/2 text-xl">🔍</div>
      </div>
    </div>

    <div class="lg:col-span-6 relative flex justify-center items-center">
      <div class="relative w-[280px] h-[280px] sm:w-[380px] sm:h-[380px] md:w-[420px] rounded-[40px] overflow-hidden shadow-2xl border-4 border-white rotate-2 bg-gray-50">
        <img src="https://images.unsplash.com/photo-1546833999-b9f581a1996d?q=80&w=800&auto=format&fit=crop" alt="Premium Indian Luxury Thali" class="w-full h-full object-cover">
      </div>
    </div>
  </div>
</section>

<section id="menu" class="py-20 px-4 md:px-12 bg-white max-w-7xl mx-auto">
  <div class="text-center space-y-3 mb-12">
    <span class="text-[#FF8806] uppercase tracking-widest text-xs font-black">Our Masterpieces</span>
    <h2 class="fp text-3xl md:text-4xl font-black text-black">Explore The Curated Menu</h2>
    <div class="w-12 h-1 bg-[#FF8806] mx-auto rounded-full"></div>
  </div>

  <div class="flex items-center gap-3 overflow-x-auto pb-6 mb-10 no-scroll justify-start md:justify-center px-2">
    <button class="cat-tab cat-active px-6 py-3 rounded-full font-bold text-xs uppercase tracking-widest whitespace-nowrap transition-all duration-300" data-cat="all">All Items</button>
    <button class="cat-tab cat-inactive px-6 py-3 rounded-full font-bold text-xs uppercase tracking-widest whitespace-nowrap transition-all duration-300" data-cat="starters">Starters</button>
    <button class="cat-tab cat-inactive px-6 py-3 rounded-full font-bold text-xs uppercase tracking-widest whitespace-nowrap transition-all duration-300" data-cat="main">Main Course</button>
    <button class="cat-tab cat-inactive px-6 py-3 rounded-full font-bold text-xs uppercase tracking-widest whitespace-nowrap transition-all duration-300" data-cat="breads">Murthal Parathas & Breads</button>
    <button class="cat-tab cat-inactive px-6 py-3 rounded-full font-bold text-xs uppercase tracking-widest whitespace-nowrap transition-all duration-300" data-cat="desserts">Desserts & Drinks</button>
  </div>

  <div id="menuGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 min-h-[400px]">
    </div>

  <div id="pagination" class="flex justify-center items-center gap-2 mt-12">
    </div>
</section>

<script>
// DEDICATED REAL AND EXACT IMAGES FOR EVERY SINGLE FOOD ITEM
const menuData = [
  {
    id: 1,
    name: "Amritsari Paneer Tikka",
    cat: "starters",
    price: "₹340",
    desc: "Fresh cottage cheese cubes marinated in premium hung curd and hand-pounded spices, charred perfectly in clay tandoor.",
    img: "https://images.unsplash.com/photo-1599487488170-d11ec9c172f0?q=80&w=600&auto=format&fit=crop",
    veg: true,
    tag: "Chef's Choice"
  },
  {
    id: 2,
    name: "Tandoori Soya Chaap",
    cat: "starters",
    price: "₹290",
    desc: "Juicy soya chaap marinated in rich tandoori masalas, grilled over live charcoal coals, served with mint chutney.",
    img: "https://images.unsplash.com/photo-1626132647523-66f5bf380027?q=80&w=600&auto=format&fit=crop",
    veg: true,
    tag: "Trending"
  },
  {
    id: 3,
    name: "Hara Bhara Kebab",
    cat: "starters",
    price: "₹260",
    desc: "Crispy tandoor-baked patties filled with fresh organic spinach, green peas, mashed potatoes, and delicate spices.",
    img: "https://images.unsplash.com/photo-1645112411341-6c4fd023714a?q=80&w=600&auto=format&fit=crop",
    veg: true,
    tag: ""
  },
  {
    id: 4,
    name: "Shahi Paneer Butter Masala",
    cat: "main",
    price: "₹390",
    desc: "Soft paneer cubes simmered in a velvety, rich satin-smooth tomato and cashew nut gravy cooked in premium white butter.",
    img: "https://images.unsplash.com/photo-1631452180519-c014fe946bc7?q=80&w=600&auto=format&fit=crop",
    veg: true,
    tag: "Best Seller"
  },
  {
    id: 5,
    name: "Murthal Special Dal Makhani",
    cat: "main",
    price: "₹360",
    desc: "Black lentils slow-cooked overnight for 12 hours on traditional tandoor embers, finished with absolute pure dairy cream.",
    img: "https://images.unsplash.com/photo-1626777552726-4a6b54c97e46?q=80&w=600&auto=format&fit=crop",
    veg: true,
    tag: "Legendary"
  },
  {
    id: 6,
    name: "Pind Se Kadhai Chole",
    cat: "main",
    price: "₹290",
    desc: "Spicy chickpea masterclass cooked with traditional North Indian spices, dry mango powder, and aromatic ginger juliennes.",
    img: "https://images.unsplash.com/photo-1601050690597-df056fb4ce78?q=80&w=600&auto=format&fit=crop",
    veg: true,
    tag: ""
  },
  {
    id: 7,
    name: "Aloo Pyaaz Tandoori Paratha",
    cat: "breads",
    price: "₹120",
    desc: "Iconic thick, crispy clay-oven baked golden flatbread stuffed with spiced potatoes and onions, served with premium white butter.",
    img: "https://images.unsplash.com/photo-1606491956689-2ea866880c84?q=80&w=600&auto=format&fit=crop",
    veg: true,
    tag: "Iconic"
  },
  {
    id: 8,
    name: "Premium Butter Naan",
    cat: "breads",
    price: "₹90",
    desc: "Super soft leavened clay-oven flatbread multi-layered gracefully with rich premium Amul butter melt.",
    img: "https://images.unsplash.com/photo-1626132585409-d029255a7442?q=80&w=600&auto=format&fit=crop",
    veg: true,
    tag: ""
  },
  {
    id: 9,
    name: "Murthal Special Jumbo Lassi",
    cat: "desserts",
    price: "₹140",
    desc: "Thick creamy rich yogurt shake churned in traditional wooden madhani, topped with an absolute thick layer of malai.",
    img: "https://images.unsplash.com/photo-1706505291244-64b19793f778?q=80&w=600&auto=format&fit=crop",
    veg: true,
    tag: "Must Have"
  },
  {
    id: 10,
    name: "Hot Gulab Jamun (2 Pcs)",
    cat: "desserts",
    price: "₹110",
    desc: "Golden-fried pure khoya dumplings soaked deep in cardamom flavored warm sugar syrup.",
    img: "https://images.unsplash.com/photo-1587314168485-3236d6710814?q=80&w=600&auto=format&fit=crop",
    veg: true,
    tag: ""
  }
];

let currentCat = 'all';
let currentSearch = '';
let currentPage = 0;
const itemsPerPage = 6;

function renderMenu() {
  const grid = document.getElementById('menuGrid');
  const pagination = document.getElementById('pagination');
  
  let filtered = menuData.filter(item => {
    const matchesCat = currentCat === 'all' || item.cat === currentCat;
    const matchesSearch = item.name.toLowerCase().includes(currentSearch.toLowerCase()) || 
                          item.desc.toLowerCase().includes(currentSearch.toLowerCase());
    return matchesCat && matchesSearch;
  });

  if(filtered.length === 0) {
    grid.innerHTML = `
      <div class="col-span-full text-center py-16 space-y-2">
        <div class="text-4xl">🍽️</div>
        <h3 class="text-lg font-bold text-gray-800">No matching luxury dishes found</h3>
        <p class="text-sm text-gray-400 max-w-xs mx-auto">Try checking your spelling or selecting another category.</p>
      </div>
    `;
    pagination.innerHTML = '';
    return;
  }

  const totalPages = Math.ceil(filtered.length / itemsPerPage);
  if(currentPage >= totalPages) currentPage = 0;
  
  const start = currentPage * itemsPerPage;
  const paginatedItems = filtered.slice(start, start + itemsPerPage);

  grid.innerHTML = paginatedItems.map(item => `
    <div class="group bg-white rounded-[32px] overflow-hidden border border-gray-100 hover:border-transparent transition-all duration-500 hover:shadow-2xl hover:shadow-gray-200/60 flex flex-col h-full transform hover:-translate-y-1">
      <div class="relative aspect-[4/3] w-full overflow-hidden bg-gray-50">
        ${item.tag ? `<span class="absolute top-4 left-4 z-10 px-3 py-1 bg-black text-white text-[10px] font-black uppercase tracking-widest rounded-full shadow-md">${item.tag}</span>` : ''}
        <img src="${item.img}" alt="${item.name}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">
        <div class="absolute inset-0 bg-gradient-to-t from-black/20 via-transparent to-transparent"></div>
      </div>
      
      <div class="p-6 md:p-8 flex flex-col flex-grow justify-between space-y-4">
        <div class="space-y-2">
          <div class="flex justify-between items-start gap-4">
            <h3 class="fp text-lg md:text-xl font-bold text-black tracking-tight group-hover:text-[#FF8806] transition-colors">${item.name}</h3>
            <span class="text-base font-black text-black whitespace-nowrap">${item.price}</span>
          </div>
          <p class="text-xs md:text-sm text-gray-500 leading-relaxed font-medium line-clamp-3">${item.desc}</p>
        </div>
        
        <div class="flex items-center justify-between pt-2 border-t border-gray-50">
          <span class="flex items-center gap-1.5 text-[11px] font-bold text-gray-400 uppercase tracking-wider">
            <span class="w-2 h-2 rounded-full bg-green-600 inline-block"></span> Pure Veg
          </span>
          <button class="text-xs font-black uppercase tracking-wider text-black group-hover:text-[#FF8806] transition-colors flex items-center gap-1">
            Add To Cart <span>+</span>
          </button>
        </div>
      </div>
    </div>
  `).join('');

  if(totalPages > 1) {
    let dotsHtml = '';
    for(let i=0; i<totalPages; i++) {
      dotsHtml += `
        <button class="dot w-2.5 h-2.5 rounded-full transition-all duration-300 ${currentPage === i ? 'bg-[#FF8806] w-6' : 'bg-gray-200'}" data-page="${i}"></button>
      `;
    }
    pagination.innerHTML = dotsHtml;

    document.querySelectorAll('.dot').forEach(dot => {
      dot.addEventListener('click', function() {
        currentPage = parseInt(dot.dataset.page);
        renderMenu();
      });
    });
  } else {
    pagination.innerHTML = '';
  }
}

// ========= CATEGORY TABS EVENT =========
document.querySelectorAll('.cat-tab').forEach(function(tab) {
  tab.addEventListener('click', function() {
    document.querySelectorAll('.cat-tab').forEach(function(t){ t.classList.remove('cat-active'); t.classList.add('cat-inactive'); });
    tab.classList.add('cat-active');
    tab.classList.remove('cat-inactive');
    currentCat = tab.dataset.cat;
    currentPage = 0;
    renderMenu();
    document.getElementById('menu').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
});

// ========= SEARCH EVENT =========
document.getElementById('heroSearch').addEventListener('input', function(e) {
  currentSearch = e.target.value.trim();
  currentCat = 'all';
  currentPage = 0;
  document.querySelectorAll('.cat-tab').forEach(function(t){ t.classList.remove('cat-active'); t.classList.add('cat-inactive'); });
  document.querySelector('[data-cat="all"]').classList.add('cat-active');
  document.querySelector('[data-cat="all"]').classList.remove('cat-inactive');
  renderMenu();
  if (currentSearch) {
    document.getElementById('menu').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
});

// ========= MOBILE NAV =========
document.getElementById('mobileMenuBtn').addEventListener('click', function() {
  var nav = document.getElementById('mobileNav');
  nav.style.display = nav.style.display === 'flex' ? 'none' : 'flex';
});

// ========= HEADER SCROLL SHADOW EFFECT =========
window.addEventListener('scroll', function() {
  document.getElementById('header').classList.toggle('header-scrolled', window.scrollY > 20);
});

renderMenu();
</script>
</body>
</html>
